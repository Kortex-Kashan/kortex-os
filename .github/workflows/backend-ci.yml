name: Backend CI

# Read-only validation for the Python backend, per the Production Hardening
# CI/CD work package (docs/architecture/PRODUCTION_HARDENING_RECONCILIATION.md
# §5.9). Reproduces the exact ruff/mypy/pytest commands already used locally
# and by .pre-commit-config.yaml -- no new tooling introduced. Deliberately
# does not deploy, publish, build installers, or touch the database
# migration/boot behavior established by Database Migration Wiring (DONE).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Lint, type-check, and test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # backend/pyproject.toml: requires-python = ">=3.12"; backend/requirements.txt
      # and requirements-dev.txt both target 3.12+ explicitly.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Same commands .pre-commit-config.yaml's ruff hook and this repo's own
      # `[tool.ruff]` config (backend/pyproject.toml) already define.
      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      # backend/pyproject.toml's `[tool.mypy]` already scopes this to `src`
      # (mypy_path = ["src"]) in strict mode -- this reproduces that exactly,
      # not a new configuration.
      - name: mypy
        run: python -m mypy src

      # `-q` plus `-rf` so the short summary names every failing test. The step
      # stays blocking; the tee only mirrors output for the reporting step below.
      - name: pytest
        run: python -m pytest -q -rf 2>&1 | tee pytest-output.txt; exit "${PIPESTATUS[0]}"

      # Raw job logs require repository admin rights, so a failing test run is
      # otherwise unreadable from the API. Re-emitting the summary lines as
      # workflow `::error::` commands surfaces them as check annotations, which
      # are readable. Diagnostic only -- `if: failure()` means this never
      # affects the job's outcome, and the pytest gate above remains blocking.
      - name: Report failing tests
        if: failure()
        run: |
          if [ -f pytest-output.txt ]; then
            sed -n '/short test summary info/,$p' pytest-output.txt \
              | grep -E '^(FAILED|ERROR)' \
              | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 40 pytest-output.txt
          else
            echo "::error::pytest produced no output file"
          fi
