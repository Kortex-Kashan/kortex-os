name: Backend CI

# Read-only validation for the Python backend, per the Production Hardening
# CI/CD work package (docs/architecture/PRODUCTION_HARDENING_RECONCILIATION.md
# §5.9). Reproduces the exact ruff/mypy/pytest commands already used locally
# and by .pre-commit-config.yaml -- no new tooling introduced. Deliberately
# does not deploy, publish, build installers, or touch the database
# migration/boot behavior established by Database Migration Wiring (DONE).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Lint, type-check, and test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # backend/pyproject.toml: requires-python = ">=3.12"; backend/requirements.txt
      # and requirements-dev.txt both target 3.12+ explicitly.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Same commands .pre-commit-config.yaml's ruff hook and this repo's own
      # `[tool.ruff]` config (backend/pyproject.toml) already define.
      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      # backend/pyproject.toml's `[tool.mypy]` already scopes this to `src`
      # (mypy_path = ["src"]) in strict mode -- this reproduces that exactly,
      # not a new configuration.
      - name: mypy
        run: python -m mypy src

      - name: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -ra --tb=short 2>&1 | tee pytest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## Pytest Failure Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 pytest_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      - name: Upload pytest failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-log
          path: backend/pytest_output.txt

  # Docker Production Build validation (implementation_plan.md §14). Extends
  # this existing workflow rather than introducing a separate one; gated on
  # the lint/test job above so a broken backend never reaches an image
  # build. Builds and smoke-tests docker/Dockerfile.backend only -- no
  # registry publish, no image signing, no deployment automation.
  docker:
    name: Docker build and smoke test
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f docker/Dockerfile.backend -t kortex-backend:ci .

      - name: Start container with throwaway CI secrets
        run: |
          # Freshly generated per run, never committed, never reused --
          # exists only to satisfy entrypoint.sh's fail-closed preflight
          # (implementation_plan.md §5, §12) so the smoke test can boot the
          # application; not a production key-management mechanism.
          MASTER_KEY="0x$(openssl rand -hex 32)"
          SIGNING_KEY="0x$(openssl rand -hex 32)"
          docker run -d --name kortex-ci \
            -e KORTEX_MASTER_KEY="${MASTER_KEY}" \
            -e KORTEX_AUTH_SIGNING_PRIVATE_KEY="${SIGNING_KEY}" \
            -p 8000:8000 \
            kortex-backend:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "Container is healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 5
          done
          echo "Container did not become healthy in time." >&2
          docker logs kortex-ci || true
          exit 1

      - name: Verify non-root runtime user
        run: |
          RUNTIME_USER=$(docker exec kortex-ci whoami)
          echo "Runtime user: ${RUNTIME_USER}"
          if [ "${RUNTIME_USER}" = "root" ]; then
            echo "Container is running as root -- expected non-root 'kortex'." >&2
            exit 1
          fi

      - name: Verify no secret material or VCS metadata in image layers
        run: |
          if docker history --no-trunc kortex-backend:ci | grep -i -E "KORTEX_MASTER_KEY|KORTEX_AUTH_SIGNING_PRIVATE_KEY"; then
            echo "Secret material found in image history." >&2
            exit 1
          fi
          if docker run --rm --entrypoint sh kortex-backend:ci -c 'test -e /.git -o -e /app/.git'; then
            echo ".git metadata leaked into the image." >&2
            exit 1
          fi

      - name: Stop container
        if: always()
        run: |
          docker stop kortex-ci || true
          docker rm kortex-ci || true
