name: Desktop CI

# Read-only validation for the desktop app (apps/desktop, design-system) and
# its Tauri/Rust shell, per the Production Hardening CI/CD work package
# (docs/architecture/PRODUCTION_HARDENING_RECONCILIATION.md §5.9). Reproduces
# the exact pnpm/tsc/vitest/cargo commands already used locally -- no new
# tooling introduced. Deliberately does not build/sign/publish installers,
# invoke `tauri build`, or run any release/deployment step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck and test (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Root package.json pins the package manager exactly
      # ("packageManager": "pnpm@11.23.0+...") -- pnpm/action-setup reads
      # that field automatically when `version` is omitted, so the workflow
      # never risks drifting from what the repo itself declares.
      - uses: pnpm/action-setup@v4

      # No repo-declared Node version exists anywhere (no .nvmrc/engines
      # field) -- Node 22 (active LTS) is a CI-required default, not a value
      # read from repository config. If a Node version is ever pinned in the
      # repo, this should be updated to match it rather than left to drift
      # independently.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root package.json's own "typecheck"/"test" scripts (`pnpm -r ...`)
      # already fan out to both workspace packages (design-system,
      # apps/desktop) -- reproduced here verbatim, not reimplemented per-package.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  rust:
    name: Tauri shell (cargo check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Uses `stable`, NOT the `rust-version = "1.77"` floor declared in
      # apps/desktop/src-tauri/Cargo.toml. Pinning 1.77 was the cause of this
      # job's original failure: the locked dependency graph contains
      # `icu_normalizer 2.3.0`, whose manifest declares `edition = "2024"`,
      # and Cargo 1.77.2 rejects it outright at manifest-parse time --
      # "feature `edition2024` is required ... not stabilized in this version
      # of Cargo" -- before compiling anything. edition2024 stabilized in
      # Rust 1.85. `stable` is what developers actually build with locally
      # (verified against cargo 1.98.0), so CI now matches the real toolchain
      # rather than an MSRV floor the current Cargo.lock no longer satisfies.
      # NOTE (separate decision, deliberately not changed here): Cargo.toml's
      # `rust-version = "1.77"` is therefore stale relative to its own
      # Cargo.lock. Correcting that declaration is application/certified-M7.1
      # source and needs its own authorization.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # Tauri's Linux backend needs webkit2gtk/related system libraries for
      # `cargo check`/`clippy` -- these are standard packages from the Tauri
      # project's own documented Linux prerequisites, not KORTEX-specific.
      # libsoup-3.0-dev and libdbus-1-dev are retained deliberately: they were
      # added while investigating this job's failure and did NOT fix it (the
      # cause was the toolchain pin, see above), but Cargo.lock shows they are
      # genuine build-time requirements once compilation actually proceeds --
      # `webkit2gtk-sys` depends directly on `soup3-sys`, whose build script
      # probes libsoup-3.0 via `system-deps`, and `dbus` depends on
      # `libdbus-sys`, whose build script probes dbus-1 via `pkg-config`.
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libdbus-1-dev

      - name: cargo check
        run: cargo check

      # Informational only (continue-on-error): no repo-established clippy
      # strictness convention exists (no clippy.toml, no deny(warnings)) --
      # `cargo check` above is the blocking Rust validation gate. Denying all
      # clippy warnings would introduce a new, stricter policy unilaterally
      # and immediately fail on a pre-existing, unrelated lint
      # (`large_enum_variant` in sidecar.rs) that predates this CI/CD work.
      - name: cargo clippy (informational)
        continue-on-error: true
        run: cargo clippy

  # Desktop Installers milestone (implementation_plan.md Part 2). Windows is
  # the fully-validated target (OD-DI-3): no macOS runner is used here, and
  # none is faked -- see implementation_plan.md Part 2 §D18/§D26. Build-only,
  # unsigned (OD-DI-2 -- signing credentials are a separate, non-blocking
  # release gate, not required to prove the packaging pipeline itself works).
  windows-installer:
    name: Windows installer build and smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies and PyInstaller
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller

      # --onedir, not --onefile -- avoids re-extracting the ~150MB+ native
      # dependency set (onnxruntime/opencv/numpy) on every launch. See
      # installer/pyinstaller/kortex_backend.spec's own header comment and
      # implementation_plan.md Part 2 §D6.
      - name: Freeze the backend (PyInstaller --onedir)
        run: pyinstaller installer/pyinstaller/kortex_backend.spec --distpath dist --workpath build/pyinstaller --noconfirm

      - name: OCR self-test (proves bundled ONNXRuntime/RapidOCR models actually run inference)
        run: .\dist\kortex-backend\kortex-backend.exe --selftest-ocr

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Windows runners already ship WebView2 -- unlike the Linux `rust` job
      # above, no system-library install step is needed here; `tauri-cli`
      # auto-provisions WiX/NSIS themselves on first use.
      - name: tauri build (produces MSI + NSIS per tauri.conf.json's bundle.targets)
        working-directory: apps/desktop
        run: pnpm tauri build

      - name: Verify installer artifacts exist
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/msi/*.msi"
          $nsis = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe"
          if (-not $msi) { throw "No MSI artifact produced" }
          if (-not $nsis) { throw "No NSIS artifact produced" }
          Write-Output "MSI: $($msi.FullName) ($([math]::Round($msi.Length / 1MB, 1)) MB)"
          Write-Output "NSIS: $($nsis.FullName) ($([math]::Round($nsis.Length / 1MB, 1)) MB)"

      # Silent install -> launch -> poll /health -> uninstall, using
      # freshly-generated, throwaway keys (never committed, never reused) --
      # mirrors the Docker CI job's own throwaway-secret pattern (Part 1 §18).
      - name: Installer smoke test (install, launch, health, uninstall)
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait

          $exe = "$env:LOCALAPPDATA\KORTEX Desktop\kortex-desktop.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable not found at $exe" }

          $masterBytes = New-Object byte[] 32
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($masterBytes)
          $env:KORTEX_MASTER_KEY = "0x" + (($masterBytes | ForEach-Object { $_.ToString("x2") }) -join '')
          $signingBytes = New-Object byte[] 32
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($signingBytes)
          $env:KORTEX_AUTH_SIGNING_PRIVATE_KEY = "0x" + (($signingBytes | ForEach-Object { $_.ToString("x2") }) -join '')

          Start-Process -FilePath $exe
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -TimeoutSec 2 -UseBasicParsing
              if ($resp.StatusCode -lt 400) { $healthy = $true; break }
            } catch {}
          }
          if (-not $healthy) { throw "Installed application did not become healthy within 30s" }
          Write-Output "Installed application healthy after $($i + 1)s"

          Get-Process kortex-desktop -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Process kortex-backend -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          $uninstaller = "$env:LOCALAPPDATA\KORTEX Desktop\uninstall.exe"
          if (Test-Path $uninstaller) {
            Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          }
          Start-Sleep -Seconds 1
          if (Test-Path $exe) { throw "Uninstall did not remove the installed executable" }

      - uses: actions/upload-artifact@v4
        with:
          name: kortex-desktop-windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
