[[permission]]
identifier = "allow-browser-create-surface"
description = "Allows the webview to create a new embedded browser surface (Browser-B1). Accepts only an opaque profile id (never a filesystem path — resolved to a sanitized directory entirely in Rust) and an initial URL. Grants no capability/governance layer of its own — see docs/architecture/browser_capability_model.md for the future kortex.browser.* actions this does not implement."
commands.allow = ["browser_create_surface"]

[[permission]]
identifier = "allow-browser-navigate"
description = "Allows the webview to navigate an existing browser surface (identified by an opaque surface id) to a new URL. Does not grant the calling webview any capability over any other surface, and does not itself grant network access to the caller — the request executes entirely in Rust against the target surface's own WebView2 instance."
commands.allow = ["browser_navigate"]

[[permission]]
identifier = "allow-browser-reload"
description = "Allows the webview to reload an existing browser surface."
commands.allow = ["browser_reload"]

[[permission]]
identifier = "allow-browser-go-back"
description = "Allows the webview to navigate an existing browser surface one step back in its own session history (Browser-B2)."
commands.allow = ["browser_go_back"]

[[permission]]
identifier = "allow-browser-go-forward"
description = "Allows the webview to navigate an existing browser surface one step forward in its own session history (Browser-B2)."
commands.allow = ["browser_go_forward"]

[[permission]]
identifier = "allow-browser-set-bounds"
description = "Allows the webview to reposition/resize an existing browser surface within the main window (Browser-B2 — window-resize tracking and tab-switching). Grants no capability over any other surface and no filesystem/native access — this only moves/resizes an already-created WebView2 child surface."
commands.allow = ["browser_set_bounds"]

[[permission]]
identifier = "allow-browser-query-state"
description = "Allows the webview to read a browser surface's current URL only — no page content, no cookies, no credentials."
commands.allow = ["browser_query_state"]

[[permission]]
identifier = "allow-browser-destroy"
description = "Allows the webview to destroy a browser surface it created."
commands.allow = ["browser_destroy"]

# Browser-B3: profile lifecycle. Every command below resolves the
# authoritative tenant identity itself (IpcClientState::current_tenant_id(),
# OD-B7) — none of them accept a tenant id as a parameter, so granting them
# to the trusted "main" webview cannot be used to reach another tenant's
# profiles regardless of what the caller supplies.

[[permission]]
identifier = "allow-browser-list-profiles"
description = "Allows the webview to list the current tenant's own browser profiles (id, display name, timestamps, availability only — never profile contents)."
commands.allow = ["browser_list_profiles"]

[[permission]]
identifier = "allow-browser-create-profile"
description = "Allows the webview to create a new browser profile for the current tenant, given only a display name. The resulting BrowserProfileId is opaque and CSPRNG-random; this permission grants no filesystem path control."
commands.allow = ["browser_create_profile"]

[[permission]]
identifier = "allow-browser-rename-profile"
description = "Allows the webview to change an existing profile's display name (presentation metadata only — never used to construct a filesystem path)."
commands.allow = ["browser_rename_profile"]

[[permission]]
identifier = "allow-browser-delete-profile"
description = "Allows the webview to delete a profile it owns (via the current tenant). Refused by the store itself while a live process holds that profile's lock."
commands.allow = ["browser_delete_profile"]
