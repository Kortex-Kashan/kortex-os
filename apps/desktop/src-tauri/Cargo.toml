[package]
name = "kortex-desktop"
version = "0.1.0"
description = "KORTEX OS desktop shell — native Tauri container"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kortex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# Browser-B1: `unstable` unlocks `Window::add_child` (embedded child-webview
# creation), which the pinned 2.11.5 gates behind this Cargo feature — see
# docs/architecture/browser_b1_preflight_report.md §3. `tauri-runtime-wry`'s
# own `unstable` feature is `[]` (empty): this adds no new transitive
# dependency, it only unlocks already-compiled, already-audited-upstream
# code behind a cfg flag.
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# `windows-native` activates the real Windows Credential Manager backend
# (keyring-3.6.3/src/lib.rs: without ANY platform feature enabled, this
# crate silently falls back to its own in-memory `mock` store on every
# platform, including Windows -- confirmed by direct process-boundary
# testing: a value stored via a bare `keyring = "3"` build is unreadable
# ("ConfirmedAbsent") from a second process, meaning master/signing keys
# never actually persisted despite secure_keys.rs's fail-closed design
# around persistence). The feature's extra dependencies (windows-sys,
# byteorder) are gated by the keyring crate itself under
# `[target.'cfg(target_os = "windows")']`, so enabling it here has no
# effect on non-Windows builds and does not claim macOS/Linux native
# support (OD-DI-3 scope: Windows is the only released target).
keyring = { version = "3", features = ["windows-native"] }
# Phase A (post-RC authentication completion): OAuth sign-in (Google/
# Microsoft) callback handling. `deep-link` opens `kortex-auth://` URLs
# into this app; `single-instance` is required alongside it on Windows,
# where the OS delivers a deep link as argv to a *new* process launch
# rather than an event on the already-running one — this plugin detects
# that and forwards argv to the existing instance instead, so the pending
# OAuth flow's in-memory state is never orphaned in an abandoned second
# window. Neither plugin adds a second process supervisor: both operate
# entirely within Tauri's own existing single lifecycle owner.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-shell = "2"
# M7.1: platform CSPRNG for persistent master/signing key generation
# (`secure_keys.rs`) — already present transitively (pulled in by several
# existing dependencies); added directly here rather than relying on that
# implicitly, since this crate now calls it itself.
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
# Win32 Job Object support for sidecar child process lifecycle binding
# (JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE). Already present in Cargo.lock via tauri.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }
# Browser-B2: direct access to raw WebView2 COM interfaces
# (`ICoreWebView2::GoBack`/`GoForward`/`CanGoBack`/`CanGoForward`, and the
# `NavigationStarting`/`NavigationCompleted` events real loading state is
# derived from — see `browser_runtime.rs`'s module doc). Both crates are
# already present in Cargo.lock, transitively, via `tauri`'s own `wry`
# feature — this promotes them to a direct dependency, at the exact
# already-resolved versions (`webview2-com` 0.38, `windows` 0.61, matching
# `tauri-2.11.5`'s own Cargo.toml pins exactly), so this crate's own code can
# name their types. No new crate or version enters the dependency graph.
webview2-com = "0.38"
windows = "0.61"

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Browser-B1: `tauri`'s `test` feature (`tauri::test::{mock_builder,
# MockRuntime, ...}`) was evaluated for in-process `Window`/`Webview`
# lifecycle tests, but enabling it alongside `unstable` reproducibly crashes
# every test binary at process startup on this machine
# (STATUS_ENTRYPOINT_NOT_FOUND / 0xC0000139) — confirmed via bisection that
# `unstable` alone does not cause this (56/56 pre-existing tests still pass
# with only `unstable` enabled). Root cause not further isolated within
# Browser-B1's scope; see docs/architecture/browser_b1_implementation_report.md
# TESTS section. `browser_runtime.rs`'s tests therefore cover pure logic
# only (no live Window/Webview construction) — deliberately, not silently.

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
