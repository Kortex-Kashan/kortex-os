[package]
name = "kortex-desktop"
version = "0.1.0"
description = "KORTEX OS desktop shell — native Tauri container"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kortex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
