[project]
name = "kortex"
version = "0.1.0"
description = "KORTEX OS — Local-First AI Business Operating System"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "KORTEX AI"}]
readme = "README.md"

# Core dependencies
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "tzdata>=2024.1",
    # Phase 4 Document Intelligence Engine: deterministic local PDF text/
    # metadata/table extraction (pure Python, no subprocess, no system
    # package — verified during the M2/M3 dependency spike).
    "pdfplumber>=0.11.0",
    # Local OCR (ONNXRuntime CPU backend, models bundled in the wheel — no
    # runtime network access, no subprocess, no system package).
    "rapidocr-onnxruntime>=1.4.0",
    "opencv-python-headless>=4.5.1.48",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
]
ai = [
    "ollama>=0.4.0",
    "chromadb>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "default",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring database",
    "e2e: End-to-end tests",
    "slow: Tests that take more than 5 seconds",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

# `rapidocr-onnxruntime` ships no type stubs / py.typed marker (verified
# during the Document Intelligence Engine OCR dependency spike). Narrowly
# scoped to this one third-party package, not a project-wide relaxation.
[[tool.mypy.overrides]]
module = ["rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "ANN",   # flake8-annotations
    "S",     # flake8-bandit (security)
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "RUF",   # Ruff-specific rules
]
ignore = [
    # `S101` (use of `assert`): assert is the assertion mechanism pytest is built
    # on, and `assert` is used in `src` only for internal invariants.
    "S101",
    # `ANN401` (dynamically typed `Any` in annotations): KORTEX is a
    # capability-dispatch platform. `Any` is intentional and correct at its
    # dynamic boundaries -- `CapabilityDispatcher` handler signatures, JSON/dict
    # payloads crossing the HTTP/IPC edge, `IEngineDiagnostics` return maps and
    # `Protocol` surfaces that accept arbitrary engine payloads. Replacing those
    # with concrete types would change public engine/capability signatures, which
    # is an API change, not a lint fix. mypy in strict mode over `src`
    # (`[tool.mypy]` below, and the `mypy src` CI step) remains the authoritative
    # typing gate; strict mypy already rejects *implicit* Any, which is the
    # actual risk ANN401 exists to catch.
    "ANN401",
    # `UP042` (`class X(str, Enum)` -> `StrEnum`): not behaviour-preserving here.
    # `str(SomeEnum.MEMBER)` yields "SomeEnum.MEMBER" under `(str, Enum)` but
    # "member_value" under `StrEnum`. These enums are serialized into API
    # payloads, persisted columns, audit records and log lines across certified
    # engines, so the rewrite would be an observable behaviour change to
    # already-certified functionality rather than a cleanup.
    "UP042",
]

# Note: `ANN101`/`ANN102` were previously listed here. Both rules have been
# removed from Ruff, which warns that ignoring them has no effect, so they are
# dropped rather than carried as dead configuration.

[tool.ruff.lint.per-file-ignores]
# Test-suite conventions. These are scoped to `tests/` only -- `src/` is held to
# the full rule set.
"tests/**/*.py" = [
    # flake8-annotations: the project already scopes strict typing to `src`
    # only -- `[tool.mypy] mypy_path = ["src"]` and the Backend CI step runs
    # `mypy src`, not `mypy tests`. Requiring full annotations on fixtures,
    # helper factories and test-double methods would contradict that existing
    # decision without improving what the tests actually verify.
    "ANN",
    # flake8-bandit hardcoded-credential rules. Test credentials, fake tokens
    # and deterministic key material are the point of the security tests (e.g.
    # `_TEST_MASTER_KEY`, `"pass-alpha"`), not a leak. This extends the same
    # test-scoped reasoning the pre-existing `S101` ignore already applied.
    "S105",  # hardcoded password string
    "S106",  # hardcoded password function argument
    "S107",  # hardcoded password default
    "S108",  # hardcoded temp-file path (tmp_path-adjacent fixtures)
]

[tool.ruff.lint.isort]
known-first-party = ["kortex"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
