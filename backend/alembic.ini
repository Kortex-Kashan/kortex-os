[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Timezone-naive; timestamps are not embedded in revision filenames.
# sqlalchemy.url is intentionally NOT set here -- env.py resolves the
# connection URL through the same precedence DatabaseEngineManager already
# uses (KORTEX_DATABASE_URL environment variable, falling back to the
# existing per-user default SQLite location), so there is exactly one
# source of truth for the database URL, not two.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
